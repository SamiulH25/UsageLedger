name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.4
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      # seed_test.dart drives live provider APIs with local tokens — CI runs
      # the hermetic suites only.
      - run: flutter test test/burn_rate_test.dart test/providers_test.dart test/db_migration_test.dart test/key_backup_test.dart test/limit_notifier_test.dart test/new_providers_test.dart test/onboarding_test.dart test/runway_test.dart test/sync_ui_test.dart test/update_checker_test.dart test/add_account_test.dart

  build:
    # Signed with the debug keystore when key.properties is absent (CI);
    # local release builds use upload-keystore.jks.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.4
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: softprops/action-gh-release@v2
        with:
          files: flutter/build/app/outputs/flutter-apk/app-release.apk
          draft: true

  build-apple:
    # No Apple certs in CI: the macOS zip keeps its free ad-hoc signature
    # (Gatekeeper asks for a right-click > Open on first launch); the iOS ipa
    # is UNSIGNED and gets re-signed on-device by AltStore/Sideloadly.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    needs: test
    permissions:
      contents: write
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.4
          channel: stable
          cache: true
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - name: Build macOS app
        run: flutter build macos --release
      - name: Zip macOS app
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --keepParent UsageLedger.app \
            "UsageLedger-${{ github.ref_name }}-macos.zip"
      - name: Build iOS app (no codesign)
        run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          cp -R Runner.app Payload/
          zip -qry "UsageLedger-${{ github.ref_name }}-ios-unsigned.ipa" Payload
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            flutter/build/macos/Build/Products/Release/UsageLedger-*-macos.zip
            flutter/build/ios/iphoneos/UsageLedger-*-ios-unsigned.ipa
          draft: true
